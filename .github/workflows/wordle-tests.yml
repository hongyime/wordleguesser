name: Wordle regressions
on:
  push:
    paths: ['wordleguesser.py', 'tests/**', '.github/workflows/wordle-tests.yml']
  pull_request:
    paths: ['wordleguesser.py', 'tests/**', '.github/workflows/wordle-tests.yml']
permissions:
  contents: read
concurrency:
  group: wordle-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s tests -v
